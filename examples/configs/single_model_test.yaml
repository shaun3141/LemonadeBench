# Single model test - DeepSeek Chat
# Run with: lemonade batch examples/single_model_test.yaml --parallel 5

name: "DeepSeek Chat Test Run"

# Required: Benchmark taxonomy version
# v1 = Original benchmark (before Dec 2025)
# v2 = Fixed pricing display, improved context formatting (Dec 2025+)
taxonomy_version: 2

models:
  - provider: openrouter
    name: deepseek/deepseek-chat
    seeds: [1, 42, 100, 7, 2025]
    tags: [deepseek, chat, value, test]
    tools: []

logging:
  local: true
  supabase: true
  dir: ./runs
